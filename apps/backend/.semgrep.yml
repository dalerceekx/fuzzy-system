# Project-specific semgrep rules (CI runs them together with the p/default,
# p/nodejs, p/typescript and p/secrets registry rulesets, with --error).
rules:
  - id: meningfermam-no-unsafe-raw-sql
    languages: [typescript]
    severity: ERROR
    message: >-
      $queryRawUnsafe/$executeRawUnsafe build SQL from strings. Use the tagged
      template $queryRaw`...` / $executeRaw`...` (parameterized) instead.
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)

  - id: meningfermam-no-console-in-src
    languages: [typescript]
    severity: ERROR
    message: >-
      Use the Nest Logger (pino, with redaction) instead of console.* in
      application code.
    paths:
      include:
        - "/apps/backend/src/"
      exclude:
        - "/apps/backend/src/generated/"
    pattern: console.$METHOD(...)

  - id: meningfermam-no-cors-wildcard
    languages: [typescript]
    severity: ERROR
    message: >-
      CORS must use the exact CORS_ORIGINS allowlist — never '*' or a
      reflect-any-origin `true`.
    pattern-either:
      - pattern: |
          $APP.enableCors({..., origin: '*', ...})
      - pattern: |
          $APP.enableCors({..., origin: true, ...})
      - pattern: |
          cors({..., origin: '*', ...})
      - pattern: |
          cors({..., origin: true, ...})

  - id: meningfermam-no-tls-verification-bypass
    languages: [typescript]
    severity: ERROR
    message: TLS certificate verification must never be disabled.
    pattern-either:
      - pattern: |
          {..., rejectUnauthorized: false, ...}
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = $X

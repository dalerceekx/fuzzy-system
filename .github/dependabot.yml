version: 2
updates:
  # One root lockfile for the whole npm workspace (backend + frontend).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/frontend
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /apps/frontend/caddy
    schedule:
      interval: weekly
